name: Build & publish firmware

on:
  push:
    branches: [main]
    paths:
      - 'firmware/**'
      - '.github/workflows/build.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-and-merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('firmware/platformio.ini') }}
          restore-keys: |
            pio-${{ runner.os }}-

      - name: Install PlatformIO & esptool
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade platformio esptool

      - name: Build firmware (esp32dev)
        working-directory: firmware
        run: pio run -e esp32dev

      - name: Locate build artifacts
        id: artifacts
        working-directory: firmware
        run: |
          set -euo pipefail
          BUILD_DIR=".pio/build/esp32dev"
          echo "build_dir=$BUILD_DIR" >> "$GITHUB_OUTPUT"

          FW_BIN="$BUILD_DIR/firmware.bin"
          BOOTLOADER_BIN="$BUILD_DIR/bootloader.bin"
          PARTITIONS_BIN="$BUILD_DIR/partitions.bin"

          # boot_app0.bin ships with the Arduino ESP32 core, not the build dir.
          BOOT_APP0=$(find ~/.platformio/packages/framework-arduinoespressif32 \
            -name "boot_app0.bin" | head -n1)

          for f in "$FW_BIN" "$BOOTLOADER_BIN" "$PARTITIONS_BIN" "$BOOT_APP0"; do
            if [ ! -f "$f" ]; then
              echo "::error::missing expected artifact: $f"
              exit 1
            fi
          done

          echo "fw_bin=$FW_BIN" >> "$GITHUB_OUTPUT"
          echo "bootloader_bin=$BOOTLOADER_BIN" >> "$GITHUB_OUTPUT"
          echo "partitions_bin=$PARTITIONS_BIN" >> "$GITHUB_OUTPUT"
          echo "boot_app0_bin=$BOOT_APP0" >> "$GITHUB_OUTPUT"

      - name: Merge partitions into single flashable image
        run: |
          python -m esptool --chip esp32 merge_bin \
            -o firmware_merged.bin \
            --flash_mode dio \
            --flash_freq 40m \
            --flash_size 4MB \
            0x1000   "${{ steps.artifacts.outputs.bootloader_bin }}" \
            0x8000   "${{ steps.artifacts.outputs.partitions_bin }}" \
            0xe000   "${{ steps.artifacts.outputs.boot_app0_bin }}" \
            0x10000  "${{ steps.artifacts.outputs.fw_bin }}"

      - name: Commit merged firmware back to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add firmware_merged.bin
          if git diff --cached --quiet; then
            echo "No changes to firmware_merged.bin — skipping commit."
            exit 0
          fi
          git commit -m "chore(firmware): update firmware_merged.bin [skip ci]"
          git push origin HEAD:${{ github.ref_name }}

      - name: Upload build artifacts (debug)
        uses: actions/upload-artifact@v4
        with:
          name: firmware-build-${{ github.sha }}
          path: |
            firmware_merged.bin
            firmware/.pio/build/esp32dev/firmware.bin
            firmware/.pio/build/esp32dev/bootloader.bin
            firmware/.pio/build/esp32dev/partitions.bin
