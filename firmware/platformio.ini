; ---------------------------------------------------------------------------
; Vaultless 2P-OPRF hardware oracle — LilyGO T-Display (ESP32 + ST7789)
;
; This env mixes the "arduino" framework (for TFT_eSPI / Serial / buttons)
; with "espidf" (for the ESP-IDF managed component "espressif/libsodium",
; which provides crypto_scalarmult_ristretto255 and the ristretto255 scalar
; helpers). PlatformIO's ESP32 platform supports this combined framework
; list; the IDF component is pulled in via firmware/src/idf_component.yml.
;
; If your local PlatformIO / esp-idf version resolves the libsodium
; component under a different version tag, adjust idf_component.yml
; accordingly — check https://components.espressif.com/components/espressif/libsodium
; ---------------------------------------------------------------------------

[env:esp32dev]
; Pinned rather than floating, for the same reason idf_component.yml pins
; libsodium: this env produces firmware_merged.bin, which the website flashes
; onto people's devices. A floating platform silently changes the toolchain,
; the IDF version and the Arduino core underneath a security build.
platform = espressif32@7.0.1
board = esp32dev
framework = arduino, espidf
monitor_speed = 115200
upload_speed = 921600

; LilyGO T-Display is a 4MB-flash ESP32 module.
board_build.flash_mode = dio
board_build.flash_size = 4MB
board_build.f_flash = 40000000L
; The espidf/arduino-as-component build path (unlike plain Arduino) resolves
; this as a literal file path relative to this directory, not a built-in
; scheme name — partitions.csv is a copy of arduino-esp32's own default.csv,
; which is also what the merge_bin offsets in the CI workflow assume.
board_build.partitions = partitions.csv

; Exact versions, not caret ranges — these are the versions the pinned build is
; tested against, and a minor bump arriving unannounced in a released binary is
; not something anyone can audit after the fact.
lib_deps =
    bodmer/TFT_eSPI @ 2.5.43
    bblanchon/ArduinoJson @ 7.4.3

board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS=sdkconfig.defaults

build_flags =
    ; ---- TFT_eSPI configuration for LilyGO T-Display (ST7789, 135x240) ----
    -D USER_SETUP_LOADED=1
    -D ST7789_DRIVER=1
    -D TFT_WIDTH=135
    -D TFT_HEIGHT=240
    -D CGRAM_OFFSET=1
    -D TFT_MOSI=19
    -D TFT_SCLK=18
    -D TFT_CS=5
    -D TFT_DC=16
    -D TFT_RST=23
    -D TFT_BL=4
    -D TFT_BACKLIGHT_ON=HIGH
    -D SPI_FREQUENCY=40000000
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D SMOOTH_FONT=1

board_build.embed_txtfiles =

; ---------------------------------------------------------------------------
; Encrypted build. NOT what the website flashes — `esp32dev` above is, and it
; is left alone on purpose: enabling flash encryption burns eFuses and is
; IRREVERSIBLE, so it must never happen to someone who just clicked "Flash" on
; the site.
;
; Read firmware/SECURE_PROVISIONING.md before using either env below.
; ---------------------------------------------------------------------------
[env:esp32dev-secure]
extends = env:esp32dev
board_build.partitions = partitions-secure.csv
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS=sdkconfig.secure.defaults

; One-time provisioning build. Compiles in a {"cmd":"provision","key":"<hex>"}
; command that accepts an externally supplied k, but ONLY when NVS holds no key
; yet. It exists so an existing oracle key can be carried across the re-flash
; that flash encryption forces — otherwise every password you have ever derived
; changes.
;
; This build must not be the one you leave on the device. Flash it, provision,
; then immediately flash esp32dev-secure over it.
[env:esp32dev-provision]
extends = env:esp32dev-secure
build_flags =
    ${env:esp32dev.build_flags}
    -D VAULTLESS_ALLOW_PROVISION=1
