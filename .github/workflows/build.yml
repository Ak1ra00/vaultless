name: Build & publish firmware

on:
  push:
    branches: [main]
    paths:
      - 'firmware/**'
      - '.github/workflows/build.yml'
  workflow_dispatch: {}

# Read-only by default; the one job that pushes the rebuilt binary opts in.
permissions:
  contents: read

jobs:
  build-and-merge:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.11'

      - name: Cache PlatformIO
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('firmware/platformio.ini') }}
          restore-keys: |
            pio-${{ runner.os }}-

      - name: Install PlatformIO & esptool
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade platformio esptool

      - name: Build firmware (esp32dev)
        working-directory: firmware
        run: pio run -e esp32dev

      - name: Locate build artifacts
        id: artifacts
        run: |
          set -euo pipefail
          # Emitted paths are consumed by later steps that run from the repo
          # root, so they must include the firmware/ prefix.
          BUILD_DIR="firmware/.pio/build/esp32dev"
          echo "build_dir=$BUILD_DIR" >> "$GITHUB_OUTPUT"

          FW_BIN="$BUILD_DIR/firmware.bin"
          BOOTLOADER_BIN="$BUILD_DIR/bootloader.bin"
          PARTITIONS_BIN="$BUILD_DIR/partitions.bin"

          # boot_app0.bin ships with the Arduino ESP32 core, not the build dir.
          BOOT_APP0=$(find ~/.platformio/packages/framework-arduinoespressif32 \
            -name "boot_app0.bin" | head -n1)

          for f in "$FW_BIN" "$BOOTLOADER_BIN" "$PARTITIONS_BIN" "$BOOT_APP0"; do
            if [ ! -f "$f" ]; then
              echo "::error::missing expected artifact: $f"
              exit 1
            fi
          done

          echo "fw_bin=$FW_BIN" >> "$GITHUB_OUTPUT"
          echo "bootloader_bin=$BOOTLOADER_BIN" >> "$GITHUB_OUTPUT"
          echo "partitions_bin=$PARTITIONS_BIN" >> "$GITHUB_OUTPUT"
          echo "boot_app0_bin=$BOOT_APP0" >> "$GITHUB_OUTPUT"

      - name: Merge partitions into single flashable image
        run: |
          python -m esptool --chip esp32 merge-bin \
            -o firmware_merged.bin \
            --flash-mode dio \
            --flash-freq 40m \
            --flash-size 4MB \
            0x1000   "${{ steps.artifacts.outputs.bootloader_bin }}" \
            0x8000   "${{ steps.artifacts.outputs.partitions_bin }}" \
            0xe000   "${{ steps.artifacts.outputs.boot_app0_bin }}" \
            0x10000  "${{ steps.artifacts.outputs.fw_bin }}"

      - name: Stamp flashing manifest with this build
        run: |
          set -euo pipefail
          SHORT_SHA="$(git rev-parse --short HEAD)"
          python - "$SHORT_SHA" <<'PY'
          import json, sys

          sha = sys.argv[1]
          with open("esp-manifest.json") as fh:
              manifest = json.load(fh)

          # Cache-bust the binary URL: without this a browser that has already
          # flashed once can hand ESP Web Tools a stale firmware_merged.bin and
          # silently reflash the previous build.
          manifest["version"] = sha
          for build in manifest["builds"]:
              for part in build["parts"]:
                  part["path"] = "firmware_merged.bin?v=%s" % sha

          with open("esp-manifest.json", "w") as fh:
              json.dump(manifest, fh, indent=2)
              fh.write("\n")
          PY
          cat esp-manifest.json

      - name: Commit merged firmware back to repo
        env:
          TARGET_REF: ${{ github.ref_name }}
        run: |
          git config user.name "S.K."
          git config user.email "162945952+Ak1ra00@users.noreply.github.com"
          git add firmware_merged.bin esp-manifest.json
          if git diff --cached --quiet; then
            echo "No changes to firmware_merged.bin — skipping commit."
            exit 0
          fi
          git commit -m "chore(firmware): update firmware_merged.bin [skip ci]"
          # Passed through the environment rather than interpolated into the
          # shell: a ${{ }} expansion inside run: is substituted before bash
          # ever sees it, so a ref name carrying shell metacharacters would be
          # executed. Constrained to main by the trigger today; this keeps it
          # safe if that ever widens.
          git push origin "HEAD:refs/heads/$TARGET_REF"

      - name: Upload build artifacts (debug)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: firmware-build-${{ github.sha }}
          path: |
            firmware_merged.bin
            firmware/.pio/build/esp32dev/firmware.bin
            firmware/.pio/build/esp32dev/bootloader.bin
            firmware/.pio/build/esp32dev/partitions.bin
